# config.yaml — what the org declares: every harness knob (the catalog, DESIGN §9).
# Boot and `liquen reload` apply it to the store: a key set here overwrites the store's,
# a key left out keeps the value the store has, and an agent it does not name is left
# alone. No command writes this file: `liquen agent` and `liquen connect` write the
# store, and `liquen config` prints its state to copy from. An unknown key is a boot
# error.

# harness machinery — every deployment works on the defaults
system:
  # how long a bash call holds the turn in the foreground before it goes to the background:
  # the turn is answered with what the command printed so far, the command runs on, and its
  # end is told when it comes; the model may give a call its own wait
  bashWaitMs: 120000
  # how long a world message waits for the rest of its burst before a turn runs
  debounceMs: 5000
  # the org's own model prices, over the package's list: rows of { model, valid_since
  # (YYYY-MM-DD), input, output, cache_read?, cache_write?, tiers? }, in USD per million
  # tokens; a row in effect wins over the package's, and `liquen log spend` prices each call
  # at the rate of its day
  prices: []

# where the org's parts live — the log and the vault, the docs, the agents' shells; shells
# off this machine need the docs in the database
deployment:
  # where the log and the vault live: "sqlite" ⇒ SQLite in data/log; a Postgres URL
  # (postgres://user@host:5432/db, ?schema= for one schema of it) ⇒ that database, its
  # password read from PGPASSWORD
  database: sqlite
  # where the docs live: filesystem ⇒ files under data/, which an agent reads and writes
  # from its shell; database ⇒ the docs table of the database above, SQLite or Postgres,
  # which an agent reaches through its read · write · edit tools
  docs: filesystem
  # where the files the org receives and sends are kept: "filesystem" ⇒ under data/storage;
  # a bucket's URL, path-style (https://<account>.r2.cloudflarestorage.com/<bucket>,
  # ?region= where the service wants one) ⇒ that bucket, over the S3 API (R2, S3, Supabase
  # Storage), its keys read from STORAGE_ACCESS_KEY_ID and STORAGE_SECRET_ACCESS_KEY. An
  # agent reads a file through its door, either way
  storage: filesystem
  # where the agents' shells run: null ⇒ this machine, as you; "bwrap" ⇒ this machine, each
  # agent in a bubble of its own (bubblewrap, the recommended way on Linux) that sees its
  # own folder, the shared floor and the system, and reaches the network as this machine
  # does; the URL of a Cloudflare sandbox gateway (sandbox/cloudflare in the package) ⇒ one
  # sandbox per agent there, its bearer token read from SANDBOX_API_KEY; needs docs:
  # database, since the sandbox cannot reach files on this machine
  sandbox: null
  # more of this machine a bubble (sandbox "bwrap") shows, each an absolute path or one
  # under ~/, read-only unless it ends in ":rw" ("~/code/repo:rw"): a tool installed in your
  # home shows only its PATH folder, so one that runs on files beside it needs its own: mise
  # ("~/.local/share/mise"), nvm ("~/.nvm"), uv ("~/.local/share/uv"). A shim finds its tool
  # from HOME, which in a bubble is the agent's folder, so the tools need their own folders
  # on PATH (mise activate does that). Every agent sees what is named; none may hold the
  # org's folder or lie in it
  mounts: []
  # how long a gateway sandbox lives after its agent's last bash call: the next step past it
  # stops the container, or the gateway does that long after its last request when the
  # harness is quiet; its background jobs and workspace files go with it (the agent is told)
  sandboxSleepMinutes: 10

# what every agent shares — the clock, the backlog, and the defaults each inherits
shared:
  # the org's clock (IANA) — every rendered stamp, cron and sleep span reads it, and it is
  # TZ in every agent shell, so what a program there prints is on the same clock
  timezone: America/Mendoza
  # the org's locale (es_AR.UTF-8) — LANG in every agent shell and media processor, so tools
  # and transcribers speak the org's language; unset, they inherit the harness's
  locale: es_AR.UTF-8
  # backlog an agent inherits at boot; lower it to come up quietly
  backlogHours: 24
  # every agent's defaults — an agents.<name> entry sets these, key by key
  agents:
    # the model an agent runs on
    model: claude-opus-5-5
    # reasoning effort (low|medium|high|xhigh|max); null ⇒ the model decides
    effort: low
    # output cap per model call
    maxTokens: 64000
    # est. tokens of raw event JSON and the pictures it inlines before a checkpoint runs,
    # between turns, or inside a turn ten times over it; input never waits for one. Also the
    # most a run of world lines between two turns may weigh in the prompt: past it, its
    # rooms share it equally, newest lines first, and the rest is left for search
    compactAt: 150000
    # est. tokens a checkpoint leaves uncovered; below compactAt
    keepRecent: 20000
    # model provider (anthropic|google); null ⇒ anthropic
    provider: anthropic
    # the tools offered to the model, by name — built-ins and exec tools (bash, MCP) alike;
    # null ⇒ every tool the deployment has. Add "send" where the agent has peers or a world
    # to write to — a reply to its own principal is its plain answer, never a call —
    # "conversation" where it has peers and may open rooms with them, or an account on a
    # wire whose rooms it may change, and "contact" where an account keeps an address book
    # the agent may write. With docs: database, read · write · edit are offered whatever
    # this says: they are the agent's one way to its docs
    tools: [search, cancel, bash]
    # permission policy: first match decides (allow|ask|deny); * matches any tool;
    # service/connection/conversation pin a rule to where a send lands (service: local is
    # the rooms between agents), connection to whose address book a contact is written in
    rules:
      - {tool: send, service: local, action: allow}
      - {tool: send, action: ask}
      - {tool: contact, action: ask}
      - {tool: '*', action: allow}
    # names of the harness's environment variables an agent's shell inherits, read at each
    # bash call — what a tool needs from the machine it runs on, like DISPLAY for a browser
    # the principal watches; shells on this machine only. A name a secret goes by (…_KEY,
    # …_TOKEN, …_SECRET, …PASSWORD) is refused
    export: [DISPLAY, WAYLAND_DISPLAY, XDG_RUNTIME_DIR]
    # attention: a conversation stays hot this long after the agent's own last word
    engagedMinutes: 15
    # attention: an ambient pile this deep wakes the agent before the interval does
    digestAfterMessages: 25
    # attention: how often ambient conversations are looked at — the idle cadence
    digestMinutes: 15
    # attention: org-clock span "from-to" the ambient world waits out; null ⇒ never sleeps
    sleepHours: 23-8
    # what the principal's surfaces hear of the agent at work, as it starts: off ⇒ only its
    # words, its approval cards and its errors; waiting ⇒ also memorizing, compacting and
    # thinking, and each call as working, each as it starts; tools ⇒ each call by name, and
    # a call that failed
    presence: waiting
    # whether a session runs for the agent; false PAUSES it — its rows still land in the log
    # and are owed when it comes back. Here, false pauses every agent that does not say
    # otherwise: the org's doors stay up, its minds do not
    mind: true

# media processors — broker-side commands that derive text from bytes (§5)
processors:
  # shell command, audio bytes on stdin → transcript on stdout — e.g.
  # "processors/qwen-asr/transcribe.sh" (root-relative; see its README); null ⇒ no
  # transcription
  audio: null

# the org's one door — the address the world dials, the one port the org binds, and the
# tunnel
edge:
  # the org's public https:// base — what a tunnel or a real host in front of edge.port
  # answers as; every service's address hangs off it (/<service>/ingest,
  # /<service>/oauth/callback), and the doors print the one to register; null ⇒ the org is
  # reached at http://localhost:<edge.port> only
  publicUrl: null
  # the org's one port: the edge binds it and the tunnel publishes it — it forwards
  # /<service>/… to that connector's socket under data/run
  port: 8788
  # the command that publishes edge.port at publicUrl, as an argv (["cloudflared", "tunnel",
  # "run", "acme"]), run and kept alive by `liquen start` beside the org; null ⇒ something
  # else runs it (systemd, a host's own proxy)
  tunnel: null

# the roster: every key is a member — an agent, its folder and its unix user, or a person
# alone (mind: false)
# <name>: any shared.agents key set for this agent, plus identity — the name the agent goes
# by and the handles of the account it acts as (null ⇒ it has none); principals — who steers
# it, roster names ([] ⇒ nobody; "*" ⇒ anyone writing in its steering room; absent ⇒ its
# owner, or every member when the account is the org's); mind: false — no session runs: a
# member with no agent of their own, or an agent paused. An agent made by `liquen agent` or
# a connector and not named here runs on what the store holds
agents:
  chiche: {}

# the connectors' knobs — a subsection per connector, validated by its owner
connections: {}
