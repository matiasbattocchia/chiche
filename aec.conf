# aec.conf — the echo-cancel module in a process of its own: `pipewire -c aec.conf`.
#
# aec.ts raises this for the run instead of `pactl load-module module-echo-cancel`.
# Loaded through pactl the module lives inside pipewire-pulse, and with the graph
# at quantum 480 its data loop occasionally overruns the 200 ms realtime budget rtkit
# hands out (RLIMIT_RTTIME, soft == hard): the kernel SIGKILLs the whole daemon,
# the module vanishes, pw-record silently reattaches to the raw mic and the model
# starts hearing itself. Reproduced through the speakers, the HDMI sink, a muted
# sink, and in a standalone process with module-rt; never without module-rt.
#
# So no module-rt here: the data loop runs SCHED_OTHER, which the RTTIME limit
# doesn't touch. The cost is a few xruns per minute on the mic driver; the
# alternative was the module dying mid-conversation.
context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # noise suppression and gain control ride along with the canceller
            aec.args = {
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.gain_control = true
                webrtc.transient_suppression = true
            }
            # the node names audio.ts targets — keep in step with aec.ts
            source.props = { node.name = gemini_aec_source }
            sink.props   = { node.name = gemini_aec_sink }
        }
    }
]
