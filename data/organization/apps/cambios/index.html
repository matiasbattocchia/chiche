<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambios</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f5132; color: #fff; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  #count { opacity: .8; margin-bottom: 12px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input { font-size: 1.1rem; padding: 10px; border-radius: 8px; border: 0; min-width: 0; }
  #name { flex: 1; } #num { width: 70px; }
  button { font-size: 1.1rem; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  form button { background: #ffc107; font-weight: bold; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; background: #198754; border-radius: 10px;
       padding: 8px 10px; margin-bottom: 8px; transition: opacity .2s; }
  li.paused { opacity: .45; }
  .num { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #0f5132;
         display: grid; place-items: center; font-weight: bold; font-size: 1.1rem; flex: none; }
  .name { flex: 1; font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { font-variant-numeric: tabular-nums; font-size: 1.3rem; font-weight: bold; }
  .play { background: #fff; font-size: 1.4rem; width: 56px; }
  .del { background: transparent; color: #fff; opacity: .6; padding: 10px 6px; }
  .bar { display: flex; gap: 8px; margin-top: 16px; }
  .bar button { flex: 1; background: #ffffff22; color: #fff; }
  #empty { opacity: .7; text-align: center; padding: 24px; }
  #match { display: flex; align-items: center; gap: 12px; background: #00000033; border-radius: 12px;
           padding: 10px 14px; margin: 8px 0 12px; }
  #matchTime { flex: 1; font-size: 2.6rem; font-weight: bold; font-variant-numeric: tabular-nums; opacity: .6; }
  #match.running #matchTime { opacity: 1; }
  #matchBtn { background: #ffc107; font-weight: bold; font-size: 1.2rem; padding: 12px 18px; }
</style>
</head>
<body>
<main>
  <h1>⚽ Cambios</h1>
  <div id="match"><span id="matchTime">0:00</span><button id="matchBtn">▶ Empezar</button></div>
  <div id="count"></div>
  <form id="add">
    <input id="name" placeholder="Nombre" autocomplete="off">
    <input id="num" placeholder="N°" type="number" inputmode="numeric" min="0">
    <button>Agregar</button>
  </form>
  <p id="empty">Agregá los jugadores con nombre y número.</p>
  <ul id="list"></ul>
  <div class="bar">
    <button id="allOff">⏸ Sacar a todos</button>
    <button id="reset">↺ Nuevo partido</button>
  </div>
</main>
<script src="main.js" defer></script>
</body>
</html>
